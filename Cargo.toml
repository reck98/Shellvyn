[workspace]
resolver = "2"
members = [
    "crates/shellvyn-core",
    "crates/shellvyn-pty",
    "crates/shellvyn-signaling",
    "crates/shellvyn-agent",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["Shellvyn Contributors <aashish7648@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/reck98/Shellvyn"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
bytes = "1.10"
base64 = "0.22"
rand = "0.8"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
dashmap = "6.1"
clap = { version = "4.5", features = ["derive"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
nix = { version = "0.29", features = ["term", "process", "signal", "fs"] }

# Internal workspace crates
shellvyn-core = { path = "crates/shellvyn-core" }
shellvyn-pty = { path = "crates/shellvyn-pty" }
