name: Continuous Integration & Deployment Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Rust Workspace Test Suite
  # ============================================================================
  rust-tests:
    name: Rust Workspace Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --all --check

      - name: Clippy Lint
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: Execute Workspace Tests
        run: cargo test --workspace --verbose

  # ============================================================================
  # 2. Frontend Build & Typecheck
  # ============================================================================
  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        working-directory: web
        run: npm ci

      - name: Run Linter
        working-directory: web
        run: npm run lint

      - name: Build Web Client
        working-directory: web
        env:
          VITE_SIGNALING_URL: wss://shellvyn-signaling.onrender.com/ws
        run: npm run build

  # ============================================================================
  # 3. Docker Image Build & Health Validation
  # ============================================================================
  docker-validation:
    name: Docker Build & Healthcheck
    runs-on: ubuntu-latest
    needs: [rust-tests, frontend-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Signaling Server Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: shellvyn-signaling:ci

      - name: Verify Container Execution & Healthcheck
        run: |
          docker run -d --name signaling-test -p 8080:8080 -e PORT=8080 -e RUST_LOG=debug shellvyn-signaling:ci
          sleep 4
          curl -f http://127.0.0.1:8080/health || (docker logs signaling-test && exit 1)
          docker stop signaling-test
          docker rm signaling-test

  # ============================================================================
  # 4. Render Blueprint & Config Validation
  # ============================================================================
  blueprint-validation:
    name: Validate Deployment Specifications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate render.yaml Syntax
        run: |
          python3 -c "import yaml; yaml.safe_load(open('render.yaml'))"
          echo "✓ render.yaml is valid YAML"

      - name: Validate docker-compose.yml Syntax
        run: |
          docker compose config --quiet
          echo "✓ docker-compose.yml is valid"
