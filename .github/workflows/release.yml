name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: shellvyn.exe
            archive_name: shellvyn-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: shellvyn
            archive_name: shellvyn-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: shellvyn
            archive_name: shellvyn-macos-aarch64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build shellvyn-agent binary
        run: cargo build --release -p shellvyn-agent --target ${{ matrix.target }}

      - name: Package Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/shellvyn-agent.exe" -Destination "target/${{ matrix.target }}/release/shellvyn.exe"
          Compress-Archive -Path "target/${{ matrix.target }}/release/shellvyn.exe" -DestinationPath "${{ matrix.archive_name }}"
          Get-FileHash -Path "${{ matrix.archive_name }}" -Algorithm SHA256 | Out-File -FilePath "${{ matrix.archive_name }}.sha256"

      - name: Package Binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp "target/${{ matrix.target }}/release/shellvyn-agent" "target/${{ matrix.target }}/release/shellvyn"
          tar -czf "${{ matrix.archive_name }}" -C "target/${{ matrix.target }}/release" shellvyn
          shasum -a 256 "${{ matrix.archive_name }}" > "${{ matrix.archive_name }}.sha256"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
