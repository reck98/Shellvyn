<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="lobby-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12170d" />
      <stop offset="100%" stop-color="#0b0e08" />
    </linearGradient>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="680" fill="url(#lobby-bg)" />

  <!-- Top Header Navigation (44px) -->
  <rect width="1200" height="44" fill="#14190f" stroke="#2b3621" stroke-width="1" />
  
  <g transform="translate(24, 14)">
    <text font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#d4a23d">&gt;_</text>
    <text x="24" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f5efe3">Shellvyn</text>
    <rect x="90" y="-10" width="46" height="18" rx="3" fill="#1a2214" stroke="#2b3621" stroke-width="1" />
    <text x="98" y="3" font-family="'JetBrains Mono', monospace" font-size="10" fill="#858d73">v0.1.0</text>
  </g>

  <g transform="translate(1080, 14)">
    <circle cx="0" cy="-3" r="3" fill="#34d399" />
    <text x="10" y="0" font-family="-apple-system, sans-serif" font-size="11" fill="#858d73">Signaling Ready</text>
    <rect x="104" y="-12" width="22" height="22" rx="4" fill="#1a2214" stroke="#2b3621" stroke-width="1" />
    <!-- Sun icon -->
    <circle cx="115" cy="-1" r="3" stroke="#c9c3b4" stroke-width="1.2" fill="none" />
  </g>

  <!-- Central Connection Console -->
  <g transform="translate(380, 140)" filter="url(#card-shadow)">
    <!-- Header Text -->
    <text x="220" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#f5efe3" letter-spacing="-0.3">
      Connect to Terminal
    </text>
    <text x="220" y="24" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#c9c3b4">
      Enter an 8-character pairing code to establish a zero-knowledge session.
    </text>

    <!-- Main Card -->
    <rect y="50" width="440" height="280" rx="8" fill="#1a2214" stroke="#2b3621" stroke-width="1" />

    <!-- Input Section -->
    <g transform="translate(24, 76)">
      <text font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#858d73" letter-spacing="1">PAIRING CODE</text>
      
      <!-- Monospace Input Field -->
      <rect y="10" width="392" height="48" rx="4" fill="#0b0e08" stroke="#b8892d" stroke-width="1.5" />
      <text x="196" y="42" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600" fill="#f5efe3" letter-spacing="4">
        KV7M-9X2P
      </text>

      <!-- Connect Button -->
      <rect y="72" width="392" height="40" rx="4" fill="#4f5b2a" />
      <text x="196" y="96" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f5efe3">
        Connect to Host →
      </text>
    </g>

    <!-- Recents Section -->
    <g transform="translate(24, 210)">
      <line x1="0" y1="0" x2="392" y2="0" stroke="#1e2617" stroke-width="1" />
      <text y="18" font-family="'JetBrains Mono', monospace" font-size="10" fill="#858d73">RECENT SESSIONS</text>
      <rect y="26" width="94" height="24" rx="3" fill="#14190f" stroke="#2b3621" stroke-width="1" />
      <text x="47" y="42" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c9c3b4">KV7M-9X2P</text>
      <rect x="102" y="26" width="94" height="24" rx="3" fill="#14190f" stroke="#2b3621" stroke-width="1" />
      <text x="149" y="42" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c9c3b4">W89N-1A4C</text>
    </g>

    <!-- Loopback Button -->
    <g transform="translate(24, 282)">
      <rect width="392" height="34" rx="4" fill="#14190f" stroke="#2b3621" stroke-width="1" />
      <text x="196" y="21" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#c9c3b4">
        Connect to Local PTY (127.0.0.1:3000)
      </text>
    </g>

    <!-- Three Technical Specs Strip -->
    <g transform="translate(0, 360)">
      <!-- Spec 1 -->
      <rect width="138" height="60" rx="0" fill="none" />
      <line x1="0" y1="0" x2="138" y2="0" stroke="#1e2617" stroke-width="1" />
      <text y="18" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#c9c3b4">Zero-Knowledge</text>
      <text y="34" font-family="-apple-system, sans-serif" font-size="10" fill="#858d73">ChaCha20-Poly1305 with</text>
      <text y="48" font-family="-apple-system, sans-serif" font-size="10" fill="#858d73">HKDF session keys.</text>

      <!-- Spec 2 -->
      <g transform="translate(151, 0)">
        <line x1="0" y1="0" x2="138" y2="0" stroke="#1e2617" stroke-width="1" />
        <text y="18" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#c9c3b4">Native PTY</text>
        <text y="34" font-family="-apple-system, sans-serif" font-size="10" fill="#858d73">Direct Win32 ConPTY &amp;</text>
        <text y="48" font-family="-apple-system, sans-serif" font-size="10" fill="#858d73">POSIX openpty.</text>
      </g>

      <!-- Spec 3 -->
      <g transform="translate(302, 0)">
        <line x1="0" y1="0" x2="138" y2="0" stroke="#1e2617" stroke-width="1" />
        <text y="18" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#c9c3b4">Rate-Limited</text>
        <text y="34" font-family="-apple-system, sans-serif" font-size="10" fill="#858d73">40-bit entropy with 15m</text>
        <text y="48" font-family="-apple-system, sans-serif" font-size="10" fill="#858d73">token-bucket lockout.</text>
      </g>
    </g>
  </g>

  <!-- Bottom Monospace Status Bar (24px) -->
  <g transform="translate(0, 656)">
    <rect width="1200" height="24" fill="#14190f" stroke="#2b3621" stroke-width="1" />
    <text x="16" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#858d73">
      E2EE: <tspan fill="#c9c3b4">ChaCha20-Poly1305</tspan> / Protocol: <tspan fill="#c9c3b4">Wire v2</tspan>
    </text>
    <text x="1100" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#858d73">
      Status: <tspan fill="#34d399">Standby</tspan>
    </text>
  </g>
</svg>
